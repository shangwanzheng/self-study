<!DOCTYPE html>
<meta charset="utf-8">
<title>进度</title>
<script>
(function () {
  var KEY = 'fe-adv-course-visited';
  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function write(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { /* 本地文件模式可能拒绝写入 */ }
  }
  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== 'fe-course' || !e.source) return;
    var data = read();
    if (msg.type === 'save' && msg.patch && typeof msg.patch === 'object') {
      Object.keys(msg.patch).forEach(function (k) {
        if (!/^ch\d\d$/.test(k)) return;
        var t = Number(msg.patch[k]);
        if (!t) t = Date.now();
        if (!data[k] || t > data[k]) data[k] = t;
      });
      write(data);
      data = read();
    }
    e.source.postMessage({ source: 'fe-course', type: 'visited', req: msg.req, data: data }, '*');
  });
})();
</script>
