<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Java 服务开发 · 前端工程师自学</title>
<style>
:root{
  --bg:#07111c; --bg2:#0c1828; --card:#102033; --line:rgba(140,176,220,.18);
  --txt:#e7eef8; --dim:#93a4bd; --dim2:#6d7f99;
  --cy:#3ee0c5; --bl:#6aa6ff; --am:#f5c16c; --pu:#c4a6ff; --rd:#ff8b8b; --gr:#7dcea0;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Microsoft YaHei UI","PingFang SC","Noto Sans SC","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 500px at 10% -10%,#14345a 0,transparent 55%),var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.65}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
code,pre,.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px 40px;background:rgba(6,14,26,.88);border-right:1px solid var(--line)}
.brand{font-size:13px;letter-spacing:.14em;color:var(--cy);font-weight:800}
.side h1{font-size:20px;line-height:1.35;margin:8px 0 6px}
.side .sub{color:var(--dim);font-size:13px;margin:0 0 14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:18px;color:#fff}
.stat span{color:var(--dim2);font-size:12px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--bl));width:0}
.navbtn{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--dim);margin-bottom:4px}
.navbtn.on,.navbtn:hover{background:rgba(62,224,197,.08);border-color:rgba(62,224,197,.25);color:var(--txt)}
.side h2{margin:16px 8px 6px;font-size:12px;letter-spacing:.12em;color:var(--dim2)}
.jump{display:block;width:100%;text-align:left;background:none;border:0;color:var(--dim);padding:5px 10px;border-radius:8px;font-size:13px}
.jump:hover,.jump.on{color:var(--txt);background:rgba(255,255,255,.04)}
.main{padding:28px 36px 80px;max-width:1080px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px;background:#0c1a2c;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#0c1a2c;border-radius:999px;padding:6px 10px;font-size:13px;color:var(--dim)}
.chip.on{color:#04221c;background:var(--cy);border-color:var(--cy);font-weight:700}
.primary{background:linear-gradient(90deg,#1aa88f,#3b82f6);border:0;border-radius:12px;padding:10px 14px;font-weight:800}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--dim)}
.lead{background:linear-gradient(180deg,rgba(62,224,197,.08),rgba(106,166,255,.05));border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.lead p{margin:6px 0;color:var(--dim)}
.phase{margin:22px 0}
.phase h2{margin:0 0 4px;font-size:22px}
.phase .meta{color:var(--dim2);font-size:13px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.card.hide,.phase.hide,.group.hide{display:none}
.card.done{border-color:rgba(125,206,160,.45)}
.chead{width:100%;display:grid;grid-template-columns:42px 1fr;gap:8px;text-align:left;background:transparent;border:0;padding:14px 14px 12px}
.mark{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#0c1a2c;color:var(--cy);font-weight:800}
.card.done .mark{background:rgba(125,206,160,.18);border-color:var(--gr);color:var(--gr)}
.kicker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--dim2);font-size:12px}
.lv{border-radius:999px;padding:1px 8px;font-weight:800}
.lv.guide{color:#04221c;background:var(--cy)}
.lv.mid{color:#061426;background:var(--bl)}
.lv.senior{color:#1a1030;background:var(--pu)}
.tag{color:var(--am)}
.chead h3{margin:4px 0 2px;font-size:18px}
.why{margin:0;color:var(--dim);font-size:14px}
.detail{display:none;padding:0 16px 16px 56px}
.card.open .detail{display:block}
.detail h4{margin:14px 0 6px;font-size:14px;color:var(--cy)}
.fe{background:rgba(106,166,255,.08);border-left:3px solid var(--bl);padding:8px 12px;border-radius:0 10px 10px 0;color:#d5e4ff}
.kps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.kps span{font-size:12px;color:#d5e4ff;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
ul.clean{margin:6px 0;padding-left:18px}
ul.clean li{margin:4px 0}
pre{background:#071018;border:1px solid #1d3b56;border-radius:12px;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.55;position:relative}
.copy{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:#102033;border-radius:8px;padding:3px 8px;font-size:12px;color:var(--dim)}
.warn{background:rgba(245,193,108,.1);border:1px solid rgba(245,193,108,.35);color:#ffe3ad;border-radius:10px;padding:8px 12px;font-size:13px}
.quiz{margin-top:8px}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0c1a2c}
.qopt.good{border-color:var(--gr);background:rgba(125,206,160,.12)}
.qopt.bad{border-color:var(--rd);background:rgba(255,139,139,.1)}
.explain{color:var(--dim);font-size:14px}
.lab{margin-top:8px;padding:12px;border-radius:12px;border:1px dashed rgba(62,224,197,.35);background:rgba(62,224,197,.04)}
.labrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.labrow input{flex:1;min-width:180px;background:#071018;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colbox{background:#071018;border-radius:10px;padding:8px;min-height:88px;border:1px solid var(--line)}
.colbox h5{margin:0 0 6px;font-size:13px;color:var(--cy)}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lane{background:#071018;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px;font-size:13px}
.lane b{color:var(--cy)}
.hops{display:flex;flex-wrap:wrap;gap:6px}
.hop{border:1px solid var(--line);background:#0c1a2c;border-radius:999px;padding:6px 10px}
.hop.on{background:var(--bl);color:#061426;font-weight:800;border-color:var(--bl)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--cy);font-weight:700}
.blur td:nth-child(n+2){filter:blur(6px);user-select:none}
.deck{max-width:640px;margin:10px auto}
.flash{min-height:220px;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:28px;display:grid;place-items:center;text-align:center;font-size:22px;cursor:pointer}
.flash small{display:block;margin-top:10px;color:var(--dim);font-size:13px}
.rowbtns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.score{font-family:var(--mono);font-size:42px;margin:0}
.foot{margin-top:28px;color:var(--dim2);font-size:12px}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:18px 14px 60px}
  .detail{padding-left:14px}
  .cols3,.lanes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">POISSON · SELF STUDY</div>
    <h1>Java 服务开发自学</h1>
    <p class="sub">按知识库《Java服务开发技能模型》。<br>阅读顺序按前端工程师的缺口重排。</p>
    <div class="stats">
      <div class="stat"><b id="pPath">0/0</b><span>建议路径</span></div>
      <div class="stat"><b id="pAll">0/0</b><span>知识库全表</span></div>
    </div>
    <div class="bar"><i id="pBar"></i></div>
    <button class="navbtn on" data-view="path">建议路径</button>
    <button class="navbtn" data-view="map">技能全表</button>
    <button class="navbtn" data-view="quiz">阶段小测</button>
    <button class="navbtn" data-view="cards">命令闪卡</button>
    <h2>目录</h2>
    <div id="jumps"></div>
    <button class="ghost" id="reset" style="width:100%;margin-top:16px">清空进度</button>
  </aside>
  <main class="main">
    <div class="top">
      <input class="search" id="q" placeholder="搜索技能、知识点，例如 线程池、MyBatis、CAP" />
      <div class="chips" id="levels">
        <button class="chip on" data-level="all">全部</button>
        <button class="chip" data-level="mid">中级</button>
        <button class="chip" data-level="senior">高级</button>
        <button class="chip" data-level="todo">未学完</button>
      </div>
      <button class="primary" id="next">继续下一课</button>
    </div>
    <div id="view"></div>
    <p class="foot">条目来自团队知识库《Java服务开发技能模型》（中级、高级/资深）。表上的笔误已改正，并在卡片里注明原词。停更组件会标明，避免把时间耗在不再维护的项目上。进度存在这台浏览器的 localStorage。</p>
  </main>
</div>
<script>
const KEY = "java-skill-study-v1";
const M = (id, cat, sub, title, kps, why, fe, points, practice, done, extra={}) =>
  ({id, level: extra.level || "mid", cat, sub, title, kps, why, fe, points, practice, done, ...extra});
const S = (id, cat, sub, title, kps, why, fe, points, practice, done, extra={}) =>
  M(id, cat, sub, title, kps, why, fe, points, practice, done, {level:"senior", ...extra});

const TOPICS = [
M("bridge","给前端的读法","对照","先把你的词汇翻译成 Java",
  ["classpath","Maven","线程","类型"],
  "知识库没有单独列这一条。你已经会 HTTP、JSON、Git、异步和包管理，后面每张卡都从这些出发，避免从零假装没写过程序。",
  "对照关系先记住这几对，后面的卡会反复用到。",
  ["package.json / node_modules 对应 pom.xml / Maven 本地仓库。运行时还要能在 classpath 上找到 class。",
   "TS 类型编译后会擦掉；Java 类型留在字节码里，错了过不了编译，也会在运行时被检查。",
   "浏览器一条主线程加事件循环。Java 服务默认用线程池同时处理多个请求。",
   "fetch 在浏览器里还要过 CORS。Java 自己发 HTTP 没有 CORS，给浏览器写接口时才要补 CORS 头。",
   "JSON 里的大整数，前端会丢精度。后端的 Long 主键给前端时改成字符串。"],
  "拿自己熟悉的一个接口，写成四行：浏览器谁发起、Java 里大概哪个层接住、数据放哪、失败时长什么样。",
  "能不看表，说出 classpath、线程池、DTO 这三个词在你现有前端经验里的对应物。",
  {level:"guide", depth:"map"}),

M("m-hw","计算机基础原理","计算机基础原理","程序在 CPU、内存、硬盘之间怎么走",
  ["CPU","内存","硬盘","软件硬件关联","内核"],
  "Java 跑在 JVM 上，JVM 向操作系统要内存和线程。集合、GC、IO 的体感都从这里来。",
  "浏览器里你关心主线程和内存泄漏。Java 里你关心堆、栈，以及对象死了以后由 GC 回收，而不是你手动 free。",
  ["CPU 执行指令，内存放正在用的数据，硬盘放持久数据。访问速度差几个数量级。",
   "进程是操作系统分配资源的单位，线程是 CPU 调度的单位。一个 Java 进程里有很多线程。",
   "用户态程序通过系统调用进入内核，完成读文件、建连接、创建线程。",
   "JVM 堆上放对象，每个线程有自己的栈，放局部变量和调用栈。",
   "你写出的 .java 先编译成 .class 字节码，再由 JVM 解释或即时编译成机器码。"],
  "画一张自己的图：一个 User 对象 new 出来以后，引用在栈上，对象在堆上。方法返回后引用没了，对象等 GC。",
  "能解释为什么循环里拼接大量字符串会制造很多临时对象，以及这和前端反复创建大数组的相似处。"),

M("m-win","计算机基础原理","Windows 系统","把 JDK 放到 PATH 和 CLASSPATH 上",
  ["环境变量","PATH","CLASSPATH","常用命令"],
  "命令行找不到 java、javac，后面所有练习都起不来。这是中级表的第一道门。",
  "类似把 node、npm 加进 Path。CLASSPATH 则更像「运行时去哪些目录找模块」，只是 Java 找的是 class 和 jar。",
  ["安装 Temurin JDK 17（Spring Boot 3 的底线）。JAVA_HOME 指向 JDK 根目录，Path 加上 %JAVA_HOME%\\bin。",
   "新开一个终端跑 java -version 和 javac -version，两行都要是 17。",
   "CLASSPATH 是 JVM 找类的路径列表。用 Maven 时由 Maven 组装，不要手写一长串。",
   "dir、cd、echo %JAVA_HOME% 足够应付 Windows 侧。Linux 命令放到后面的卡。",
   "IDEA 自带的终端也要能看到同一套 JDK，避免界面用 17、终端用了旧的 8。"],
  "装好 JDK 17 和 IntelliJ IDEA Community。新建一个 Maven 工程，打印 System.getProperty(\"java.version\")。",
  "换一台终端窗口，java 和 javac 都是 17，并且能说出 PATH 和 CLASSPATH 各解决什么问题。",
  {code:`public class Hello {
    public static void main(String[] args) {
        System.out.println(System.getProperty("java.version"));
    }
}`}),

M("m-wsl","计算机基础原理","虚拟机","用 WSL 得到一个 Linux 环境",
  ["WSL","安装 Linux"],
  "表上写的是虚拟机。在 Windows 上，WSL 足够完成后面的 Linux 命令和部署练习，不必先装一整套桌面虚拟机。",
  "你可能已经用 WSL 跑过前端项目。这里要的是同一套环境里还能跑 java、mvn。",
  ["管理员 PowerShell 执行 wsl --install，装 Ubuntu。",
   "进 Ubuntu 后装 JDK：sudo apt update && sudo apt install -y openjdk-17-jdk maven。",
   "java -version、mvn -v 在 WSL 里再确认一次。Windows 和 WSL 是两套文件系统、两套环境变量。",
   "项目放在 Linux 家目录里编译更快。从 /mnt/d 访问 Windows 盘可以，但 IO 更慢。"],
  "在 WSL 里克隆或拷贝一个最小 Spring 工程，mvn -q -DskipTests package 跑通。",
  "能说清一个命令是在 Windows 终端还是在 WSL 里跑的，以及 JAVA_HOME 为什么要配两处。"),

M("m-linux","计算机基础原理","Linux 系统","进程、文件、网络这三类命令",
  ["进程命令","文件命令","网络命令","安全命令"],
  "服务部署以后，排障基本是：进程在不在、端口谁占着、日志文件里写了什么、权限够不够。",
  "前端本机排障常用任务管理器和 DevTools。服务器上没有这两样，命令就是面板。",
  ["文件：pwd、ls -la、cd、cat、less、mkdir、rm、cp、mv、find、grep。",
   "权限：chmod、chown。脚本要有执行位，配置文件不要 777。",
   "进程：ps、top、kill。先确认杀的是 Java 进程，再谈重启。",
   "网络：ss -lntp 或 netstat 看监听端口，curl 在服务器上打自己的接口。",
   "管道和重定向：java -jar app.jar > app.log 2>&1 把标准输出和错误输出送到文件。"],
  "在 WSL 里启动一个会占端口的程序，用 ss 找到 PID，再用 kill 停掉。把一次 curl 的结果写入文件。",
  "不看笔记，能查出「谁占用了 8080」和「日志最后 50 行是什么」。",
  {lab:"linux"}),

M("m-net","计算机基础原理","网络通讯","按层看一次请求",
  ["网络分层","网络基础"],
  "后面的 HTTP、TCP、Nginx、网关都是在不同层上说话。层分清了，超时到底是握手失败还是应用没返回，才分得清。",
  "你在 Network 面板看到的是 HTTP。TCP 连接、TLS、DNS 在面板的 Timing 里已经出现过。",
  ["链路到应用，记四层模型就够用：网卡、IP、TCP/UDP、应用协议。",
   "DNS 把域名变成 IP。TCP 三次握手之后才有字节流。HTTP 是跑在 TCP 上的文本或二进制协议。",
   "UDP 不保证到达和顺序。表上要求知道它和 TCP 的差别，QUIC/HTTP3 建立在 UDP 上。",
   "端口区分同一台机器上的不同进程。8080 是进程在听，不是「电脑在听」。",
   "一次前端请求：DNS → TCP → TLS → HTTP。服务端日志里的超时，要先问停在哪一层。"],
  "用浏览器访问一个 https 接口，在 Network 的 Timing 里指出 DNS、连接、TLS、等待响应各是哪一段。",
  "能把「连接被拒绝」「TLS 握手失败」「HTTP 500」分到不同层，而不是都叫网络错误。"),

M("m-col","JavaSE","集合框架","List、Set、Map 不要当成 JS 的数组和对象",
  ["Collection","List","Set","Map","Collections","Arrays"],
  "业务代码每天都在选容器。选错了，重复数据、查找变慢、空指针会一起出现。表上的 Cellection 是 Collection。",
  "JS 的数组像 List。JS 的 Set 接近 HashSet。字段不固定的对象字面量接近 Map，字段固定的应该写成 class，而不是 Map<String, Object>。",
  ["List 保留插入顺序，允许重复。ArrayList 按下标快，LinkedList 在中间插入的教学意义大于日常使用。",
   "Set 按元素是否相等去重。HashSet 无序，TreeSet 排序，LinkedHashSet 记住插入顺序。",
   "Map 存键值。HashMap 允许一个 null 键。并发读写用 ConcurrentHashMap，而不是外面套一把大锁硬扛。",
   "放进 HashSet 或当作 HashMap 键的对象，要同时正确实现 equals 和 hashCode。",
   "Collections、Arrays 是工具类：排序、二分、转不可变列表。命名上 Collections 是类，Collection 是接口。"],
  "下面的实验按 Java 规则模拟三种容器。再用 Java 写一遍：名单用 List，去重用 Set，按 id 取用户用 Map。",
  "给定「可重复的操作日志、唯一的用户名、id 到对象」，能马上说出用哪种容器，并说清 equals 和 hashCode 要一起写。",
  {lab:"col", quiz:{
    q:"「用户 id → 用户对象」放在内存里查找，默认用哪一个？",
    choices:["ArrayList，遍历查找","HashMap，按键取","HashSet，只放用户","拼成一个 JSON 字符串再解析"],
    answer:1,
    explain:"id 是键，用 Map。List 要扫描。用户字段固定，写成 class，再作为 Map 的值。Set 只能回答「在不在」，不能按 id 取出对象。"
  }, code:`List<String> names = new ArrayList<>();
names.add("ana");
names.add("ana");          // List 里有两个

Set<String> uniq = new HashSet<>(names); // 一个 ana

Map<Long, String> byId = new HashMap<>();
byId.put(1001L, "ana");
String hit = byId.get(1001L);`}),

M("m-thread","JavaSE","多线程","请求进线程池，而不是排进事件循环",
  ["线程","进程","Thread","Runnable","生命周期","同步","锁","线程池"],
  "这是前端转 Java 最大的认知差。接口变慢、数据改乱、连接池耗尽，很多都是线程模型没建起来。",

        if (used[i]) continue;
        used[i] = true;

        path.remove(path.size() - 1);

function load(){
  try { return Object.assign({done:{}, view:"path", level:"all"}, JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return {done:{}, view:"path", level:"all"}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify({done:state.done, view:state.view, level:state.level})); }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function lvName(l){ return l==="guide" ? "读法" : l==="mid" ? "中级" : "高级"; }

function progress(){
  const pathDone = pathIds.filter(id => state.done[id]).length;
  const table = TOPICS.filter(t => t.level!=="guide");
  const allDone = table.filter(t => state.done[t.id]).length;
  document.getElementById("pPath").textContent = pathDone + "/" + pathIds.length;
  document.getElementById("pAll").textContent = allDone + "/" + table.length;
  document.getElementById("pBar").style.width = (pathDone / pathIds.length * 100) + "%";
}

function cardHTML(t){
  const done = !!state.done[t.id];
  const kps = t.kps.map(k => `<span>${esc(k)}</span>`).join("");
  const points = t.points.map(p => `<li>${esc(p)}</li>`).join("");
  const code = t.code ? `<h4>代码</h4><div style="position:relative"><button class="copy" data-act="copy">复制</button><pre>${esc(t.code)}</pre></div>` : "";
  const warn = t.warn ? `<p class="warn">${esc(t.warn)}</p>` : "";
  const quiz = t.quiz ? quizHTML(t) : "";
  const labBlock = t.lab ? labHTML(t.lab) : "";
  return `<article class="card ${done?"done":""}" data-topic="${t.id}" id="t-${t.id}">
    <button class="chead" data-act="toggle">
      <span class="mark" data-act="done" title="标记已学">${done?"✓":""}</span>
      <span>
        <span class="kicker"><span class="lv ${t.level}">${lvName(t.level)}</span><span>${esc(t.cat)} · ${esc(t.sub)}</span></span>
        <h3>${esc(t.title)}</h3>
        <p class="why">${esc(t.why)}</p>
      </span>
    </button>
    <div class="detail">
      ${warn}
      <h4>表上的知识点</h4>
      <div class="kps">${kps}</div>
      <h4>和前端的对照</h4>
      <div class="fe">${esc(t.fe)}</div>
      <h4>学这些</h4>
      <ul class="clean">${points}</ul>
      <h4>最小练习</h4>
      <p>${esc(t.practice)}</p>
      <h4>怎样算过关</h4>
      <p>${esc(t.done)}</p>
      ${code}${labBlock}${quiz}
    </div>
  </article>`;
}

function quizHTML(t){
  const q = t.quiz;
  return `<div class="quiz"><h4>小测</h4><p>${esc(q.q)}</p>
    ${q.choices.map((c,i)=>`<button class="qopt" data-act="quiz" data-topic="${t.id}" data-i="${i}">${esc(c)}</button>`).join("")}
    <p class="explain" id="qx-${t.id}"></p></div>`;
}

  if (kind==="thread") return `<div class="lab"><h4>交互 · 6 个请求</h4>
    <div class="labrow"><button class="primary" data-act="thread-run">同时打进来</button></div>
    <div class="lanes"><div class="lane" id="laneJs"><b>浏览器主线程</b><div>点按钮开始</div></div>
    <div class="lane" id="laneJava"><b>Java 线程池 · 3 条线程</b><div>点按钮开始</div></div></div>
    <p class="explain" id="threadNote"></p></div>`;
  if (kind==="http") return `<div class="lab"><h4>交互 · 一次请求经过谁</h4><div class="hops" id="hops">
    ${["浏览器","DNS / TCP / TLS","Nginx","Tomcat 线程","Controller","Service","Mapper / JDBC","数据库"].map((h,i)=>`<button class="hop" data-act="hop" data-i="${i}">${h}</button>`).join("")}
    </div><p class="explain" id="hopNote">点某一跳，看这一层负责什么。</p></div>`;
  if (kind==="sort") return `<div class="lab"><h4>交互 · 先自己填，再翻开</h4>
    <button class="ghost" data-act="reveal">翻开复杂度和稳定性</button>
    <table id="sortTable" class="blur"><thead><tr><th>排序</th><th>平均</th><th>最坏</th><th>稳定</th></tr></thead>
    <tbody>
      <tr><td>冒泡</td><td>O(n²)</td><td>O(n²)</td><td>稳定</td></tr>
      <tr><td>选择</td><td>O(n²)</td><td>O(n²)</td><td>不稳定</td></tr>
      <tr><td>插入</td><td>O(n²)</td><td>O(n²)</td><td>稳定</td></tr>
      <tr><td>希尔</td><td>看增量</td><td>O(n²)</td><td>不稳定</td></tr>
      <tr><td>归并</td><td>O(n log n)</td><td>O(n log n)</td><td>稳定</td></tr>
      <tr><td>快速</td><td>O(n log n)</td><td>O(n²)</td><td>不稳定</td></tr>
    </tbody></table></div>`;
  if (kind==="linux") return `<div class="lab"><h4>交互 · 命令闪一遍</h4>
    <div class="labrow"><button class="primary" data-act="linux-next">下一题</button><button class="ghost" data-act="linux-show">看答案</button></div>
    <p class="linux-q" style="font-size:18px;margin:8px 0">点下一题</p>
    <pre class="linux-a" style="display:none"></pre></div>`;
  return "";
}

const LINUX_QA = [
  ["谁在听 8080？","ss -lntp | grep 8080"],
  ["日志最后几十行并继续跟？","tail -f app.log"],
  ["在日志里找空指针？","grep -n NullPointerException app.log"],
  ["本机确认接口活着？","curl -i http://127.0.0.1:8080/api/users/1"],
  ["给脚本执行权限？","chmod +x start.sh"],
  ["确认当前目录？","pwd"]
];
let linuxIdx = 0;

function renderJumps(){
  const box = document.getElementById("jumps");
  if (state.view==="path") {
    box.innerHTML = PATH.map(p => `<button class="jump" data-act="jump" data-target="${p.id}">${esc(p.title)}</button>`).join("");
  } else if (state.view==="map") {
    const cats = [];
    TOPICS.forEach(t => { if (!cats.includes(t.cat)) cats.push(t.cat); });
    box.innerHTML = cats.map(c => `<button class="jump" data-act="jump" data-target="c-${hash(c)}">${esc(c)}</button>`).join("");
  } else box.innerHTML = "";
}
function hash(s){ let h=0; for (const ch of s) h=(h*31+ch.codePointAt(0))>>>0; return h.toString(36); }

function render(){
  progress();
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("on", b.dataset.view===state.view));
  document.querySelectorAll("#levels .chip").forEach(b => b.classList.toggle("on", b.dataset.level===state.level));
  renderJumps();
  const view = document.getElementById("view");
  if (state.view==="path") view.innerHTML = renderPath();
  else if (state.view==="map") view.innerHTML = renderMap();
  else if (state.view==="quiz") view.innerHTML = renderQuiz();
  else view.innerHTML = renderDeck();
  applyFilter();
  paintLab();
}

function renderPath(){
  return `<section class="lead"><p><b>建议怎么走。</b>中级按你和 Java 的差距排过，全表顺序在「技能全表」里，和知识库一致。高级七十多项里，路径只收第一圈。Paxos、HBase、Thrift 这些放在全表，等项目碰到再打开。</p>
    <p>每张卡展开后有练习和过关标准。标成已学的依据是过关标准，不是把文章滑到底。</p></section>` +
    PATH.map(p => `<section class="phase" data-phase id="${p.id}"><h2>${esc(p.title)}</h2><div class="meta">${esc(p.time)} · ${esc(p.text)}</div>
      ${p.ids.map(id => cardHTML(byId.get(id))).join("")}</section>`).join("");
}

const CAT_ORDER = ["给前端的读法","计算机基础原理","JavaSE","Java后端","算法","数据结构","开发保障工具","软件测试","工具","分布式理论","分布式RPC","分布式锁","分布式存储","分布式注册中心","分布式配置中心","分布式全局ID","分布式会话","分布式事务","分布式定时任务","分布式日志搜索","消息队列","负载均衡","微服务熔断限流","微服务链路追踪","微服务网关","微服务权限认证","微服务消息总线","微服务监控","网络协议","DevOps"];
function renderMap(){
  const groups = [];
  TOPICS.forEach(t => {
    let g = groups.find(x => x.cat===t.cat && x.level===t.level);
    if (!g) { g = {cat:t.cat, level:t.level, items:[]}; groups.push(g); }
    g.items.push(t);
  });
  groups.sort((a,b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat));
  return `<section class="lead"><p>顺序对齐知识库的技能大类。中级 8 类，高级从分布式理论到 DevOps。点卡片展开。</p></section>` +
    groups.map(g => `<section class="phase" data-phase id="c-${hash(g.cat)}"><h2>${esc(g.cat)}</h2><div class="meta">${lvName(g.level)}</div>
      ${g.items.map(cardHTML).join("")}</section>`).join("");
}

function renderQuiz(){
  const pool = TOPICS.filter(t => t.quiz && (state.level==="all" || state.level==="todo" || t.level===state.level));
  if (!quizRun) {
    return `<section class="lead"><h2>阶段小测</h2><p>题目来自卡片里的小测，共 ${pool.length} 道。做完会标出该回哪一张卡。</p>
      <button class="primary" data-act="quiz-start">开始</button></section>`;
  }
  if (quizRun.i >= quizRun.items.length) {
    const wrong = quizRun.items.filter(it => it.pick!==it.answer);
    return `<section class="lead"><p class="score">${quizRun.score}/${quizRun.items.length}</p>
      <p>${wrong.length? "这些题回到卡片里再看一遍：" : "这一轮全对。"}</p>
      ${wrong.map(it => `<p><button class="jump" data-act="goto" data-id="${it.id}">${esc(byId.get(it.id).title)}</button> ${esc(it.explain)}</p>`).join("")}
      <button class="primary" data-act="quiz-start">再来一轮</button></section>`;
  }
  const it = quizRun.items[quizRun.i];
  const answered = it.pick != null;
  return `<section class="lead"><p class="meta">${quizRun.i+1} / ${quizRun.items.length}</p><h2>${esc(it.q)}</h2>
    ${it.choices.map((c,i)=>`<button class="qopt ${answered && i===it.answer ? "good" : ""} ${answered && i===it.pick && i!==it.answer ? "bad" : ""}" data-act="quiz-pick" data-i="${i}">${esc(c)}</button>`).join("")}
    <p class="explain">${answered ? esc(it.explain) : ""}</p>
    ${answered ? `<button class="primary" data-act="quiz-next">下一题</button>` : ""}</section>`;
}

function renderDeck(){
  const card = DECKS[deck.i % DECKS.length];
  return `<section class="deck"><p class="meta">闪卡 ${deck.i % DECKS.length + 1} / ${DECKS.length} · 这轮记住 ${deck.known}</p>
    <div class="flash" data-act="flip">${deck.show ? esc(card.back) : esc(card.front)}<small>${deck.show ? "点击翻回" : esc(card.tag) + " · 点击翻面"}</small></div>
    <div class="rowbtns">
      <button class="ghost" data-act="deck-no">还不会</button>
      <button class="primary" data-act="deck-yes">会了</button>
    </div></section>`;
}

function applyFilter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll("[data-topic]").forEach(el => {
    const t = byId.get(el.dataset.topic);
    const hay = [t.title,t.cat,t.sub,t.why,t.fe,t.practice,t.done,...t.kps,...t.points].join(" ").toLowerCase();
    let levelOk = state.level==="all" || t.level===state.level || (state.level==="todo" && !state.done[t.id]);
    if (state.level==="mid" && t.level==="guide") levelOk = false;
    el.classList.toggle("hide", !(levelOk && (!q || hay.includes(q))));
  });
  document.querySelectorAll("[data-phase]").forEach(p => {
    p.classList.toggle("hide", !p.querySelector("[data-topic]:not(.hide)"));
  });
}

function paintLab(){
  const list = document.getElementById("labList");
  if (!list) return;
  list.textContent = lab.list.join("  ");
  document.getElementById("labSet").textContent = lab.set.join("  ");
  document.getElementById("labMap").textContent = Object.entries(lab.map).map(([k,v]) => k + " → " + v).join("   ");
}

function openCard(id){
  const el = document.getElementById("t-"+id);
  if (!el) return;
  el.classList.add("open");
  el.scrollIntoView({behavior:"smooth", block:"start"});
}

document.body.addEventListener("click", (e) => {
  const actEl = e.target.closest("[data-act]");
  const viewBtn = e.target.closest("[data-view]");
  const levelBtn = e.target.closest("[data-level]");
  if (viewBtn) {
    state.view = viewBtn.dataset.view;
    if (state.view!=="quiz") quizRun = null;
    save(); render(); return;
  }
  if (levelBtn) { state.level = levelBtn.dataset.level; save(); applyFilter(); document.querySelectorAll("#levels .chip").forEach(b => b.classList.toggle("on", b.dataset.level===state.level)); return; }
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (act==="toggle") {
    if (e.target.closest("[data-act='done']")) return;
    actEl.closest(".card").classList.toggle("open");
    return;
  }
  if (act==="done") {
    e.stopPropagation();
    const id = actEl.closest("[data-topic]").dataset.topic;
    state.done[id] = !state.done[id];
    if (!state.done[id]) delete state.done[id];
    save(); progress();
    const card = actEl.closest(".card");
    card.classList.toggle("done", !!state.done[id]);
    actEl.textContent = state.done[id] ? "✓" : "";
    return;
  }
  if (act==="jump") { document.getElementById(actEl.dataset.target)?.scrollIntoView({behavior:"smooth"}); return; }
  if (act==="goto") {
    state.view = "map"; quizRun = null; save(); render(); openCard(actEl.dataset.id); return;
  }
  if (act==="copy") {
    const text = actEl.parentElement.querySelector("pre").textContent;
    navigator.clipboard?.writeText(text).then(() => { actEl.textContent = "已复制"; });
    return;
  }
  if (act==="col-add") {
    const input = document.getElementById("colIn");
    input.value.split(/[\s,，]+/).filter(Boolean).forEach(w => {
      lab.list.push(w);
      if (!lab.set.includes(w)) lab.set.push(w);
      lab.map[w] = (lab.map[w] || 0) + 1;
    });
    input.value = ""; paintLab(); return;
  }
  if (act==="col-clear") { lab = {list:[], set:[], map:{}}; paintLab(); return; }
  if (act==="thread-run") { runThread(); return; }
  if (act==="reveal") { document.getElementById("sortTable").classList.remove("blur"); return; }
  if (act==="hop") {
    const notes = [
      "浏览器发起 URL，带上 Cookie 或令牌。JS 仍在这条页面的主线程上。",
      "DNS 得到 IP，TCP 握手，TLS 协商密钥。这一段失败时应用日志里还没有这条请求。",
      "Nginx 按路径转发，补上头。静态资源也可能在这里直接返回。",
      "Tomcat 从线程池取出一条线程解析 HTTP。这条线程会一直占用到本次处理结束。",
      "DispatcherServlet 按映射进入方法。参数从路径和请求体绑定。",
      "业务和事务在这一层。事务代理要在进入方法之前套上。",
      "Mapper 把调用变成 SQL。PreparedStatement 传参数。",
      "数据库执行并返回行。慢查询占着的是上面那条 Tomcat 线程，以及一条数据库连接。"
    ];
    document.querySelectorAll(".hop").forEach(h => h.classList.remove("on"));
    actEl.classList.add("on");
    document.getElementById("hopNote").textContent = notes[actEl.dataset.i];
    return;
  }
  if (act==="linux-next") {
    const root = actEl.closest(".lab");
    linuxIdx = (linuxIdx + 1) % LINUX_QA.length;
    root.querySelector(".linux-q").textContent = LINUX_QA[linuxIdx][0];
    const a = root.querySelector(".linux-a");
    a.style.display = "none";
    a.textContent = LINUX_QA[linuxIdx][1];
    return;
  }
  if (act==="linux-show") {
    actEl.closest(".lab").querySelector(".linux-a").style.display = "block";
    return;
  }
  if (act==="quiz") {
    const t = byId.get(actEl.dataset.topic);
    const picked = Number(actEl.dataset.i);
    actEl.parentElement.querySelectorAll(".qopt").forEach((btn, idx) => {
      btn.classList.toggle("good", idx===t.quiz.answer);
      btn.classList.toggle("bad", idx===picked && idx!==t.quiz.answer);
    });
    document.getElementById("qx-"+t.id).textContent = t.quiz.explain;
    return;
  }
  if (act==="quiz-start") {
    const pool = TOPICS.filter(t => t.quiz).map(t => ({...t.quiz, id:t.id}));
    for (let i=pool.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    quizRun = {items:pool, i:0, score:0}; render(); return;
  }
  if (act==="quiz-pick") {
    const it = quizRun.items[quizRun.i];
    if (it.pick!=null) return;
    it.pick = Number(actEl.dataset.i);
    if (it.pick===it.answer) quizRun.score++;
    render();
    return;
  }
  if (act==="quiz-next") { quizRun.i++; render(); return; }
  if (act==="flip") { deck.show = !deck.show; render(); return; }
  if (act==="deck-yes" || act==="deck-no") {
    if (act==="deck-yes" && deck.show) deck.known++;
    deck.i++; deck.show = false; render(); return;
  }
});

document.getElementById("q").addEventListener("input", applyFilter);
document.getElementById("next").addEventListener("click", () => {
  const id = pathIds.find(x => !state.done[x]);
  if (!id) return;
  state.view = "path"; save(); render(); openCard(id);
});
document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("清空本机浏览器里的已学标记？")) return;
  state.done = {}; save(); render();
});

const HOPS_INIT = 0;
function runThread(){
  clearInterval(threadTimer);
  const jobs = [1,2,3,4,5,6];
  let jsDone = []; let jsCur = null; let jsQ = jobs.slice();
  let lanes = [null,null,null]; let wait = jobs.slice(); let javaDone = [];
  let tick = 0;
  const paint = () => {
    document.getElementById("laneJs").innerHTML = `<b>浏览器主线程</b><div>正在做：${jsCur??"—"}</div><div>排队：${jsQ.join(" ")||"—"}</div><div>完成：${jsDone.join(" ")||"—"}</div>`;
    document.getElementById("laneJava").innerHTML = `<b>Java 线程池 · 3 条线程</b>` + lanes.map((n,i)=>`<div>线程 ${i+1}：${n??"空闲"}</div>`).join("") + `<div>排队：${wait.join(" ")||"—"}</div><div>完成：${javaDone.join(" ")||"—"}</div>`;
  };
  threadTimer = setInterval(() => {
    if (jsCur==null && jsQ.length) jsCur = jsQ.shift();
    else if (jsCur!=null) { jsDone.push(jsCur); jsCur = jsQ.shift()??null; }
    lanes = lanes.map(n => {
      if (n==null && wait.length) return wait.shift();
      if (n!=null) { javaDone.push(n); return wait.shift()??null; }
      return null;
    });
    paint();
    tick++;
    if (tick>8) { clearInterval(threadTimer); document.getElementById("threadNote").textContent = "同样 6 个请求：一条线程要串行做完；3 条线程大约两轮做完。某条线程如果堵在数据库上，它在返回之前不能接新请求。"; }
  }, 450);
  paint();
}

render();
</script>
</body>
</html>
